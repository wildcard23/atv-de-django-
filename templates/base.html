<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Biblioteca{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    {% load static %}<link href="{% static 'css/biblioteca.css' %}" rel="stylesheet">
</head>
<body>
    <header class="topbar">
        <div class="container topbar-inner">
            <a class="brand" href="{% url 'livros:lista' %}">
                <span class="brand-mark"><i class="bi bi-book-half"></i></span>
                <span><b>Acervo</b><small>Biblioteca</small></span>
            </a>
            <div class="d-flex align-items-center gap-2">
                {% if user.is_authenticated %}
                    <a class="nav-about btn btn-outline-light btn-sm rounded-pill px-3" href="{% url 'livros:sobre' %}">Sobre</a>
                    <a class="btn btn-light btn-sm rounded-pill px-3" href="{% url 'livros:criar' %}">
                        <i class="bi bi-plus-lg me-1"></i> Novo livro
                    </a>
                    <span class="user-greeting d-none d-md-inline">Olá, {{ user.get_full_name|default:user.get_username }}</span>
                    <form method="post" action="{% url 'users:logout' %}" class="m-0">
                        {% csrf_token %}
                        <button class="btn btn-outline-light btn-sm rounded-pill px-3" type="submit">
                            <i class="bi bi-box-arrow-right me-1"></i>Sair
                        </button>
                    </form>
                {% else %}
                    <a class="btn btn-outline-light btn-sm rounded-pill px-3" href="{% url 'users:login' %}">Entrar</a>
                    <a class="btn btn-light btn-sm rounded-pill px-3" href="{% url 'users:signup' %}">Cadastre-se</a>
                {% endif %}
            </div>
        </div>
    </header>
    <main class="container page-content">
        {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
