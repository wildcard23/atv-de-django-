<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ titulo }} — Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container py-4">
    {% block content %}
    <section class="form-card">
        <div class="eyebrow">Ficha catalográfica</div>
        <h1>{{ titulo }}</h1>
        <form method="post" enctype="multipart/form-data" novalidate>
            {% csrf_token %}
            {{ form.as_p }}
            <div class="d-flex gap-2 mt-3">
                <button class="btn btn-library" type="submit"><i class="bi bi-check2 me-1"></i>Salvar livro</button>
                <a class="btn btn-outline-secondary" href="{% url 'livros:lista' %}">Cancelar</a>
            </div>
        </form>
    </section>
    {% endblock %}
</body>

</html>
