{% extends 'base.html' %}

{% block title %}Excluir livro — Biblioteca{% endblock %}

{% block content %}
<section class="delete-card">
    <div class="delete-icon"><i class="bi bi-trash3"></i></div>
    <div class="eyebrow">Remover do acervo</div>
    <h1>Excluir livro</h1>
    <p class="text-secondary mb-4">Confirmar a exclusão de <strong>{{ livro.titulo }}</strong>? Esta ação não pode ser desfeita.</p>
    <form method="post">
        {% csrf_token %}
        <div class="d-flex justify-content-center gap-2">
            <button class="btn btn-danger" type="submit"><i class="bi bi-trash3 me-1"></i>Excluir</button>
            <a class="btn btn-outline-secondary" href="{% url 'livros:lista' %}">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
